query blogs($take: Int = 10, $skip: Int, $where: ResourceWhereInput) {
  resources(take: $take, skip: $skip, where: $where) {
    ...BlogNoNesting
  }
}

query blogsCount($where: ResourceWhereInput) {
  resourcesCount(where: $where)
}

query blog($where: ResourceWhereUniqueInput!) {
  resource(where: $where) {
    ...BlogNoNesting
  }
}

fragment BlogNoNesting on Resource {
  id
  createdAt
  updatedAt
  name
  longtitle
  uri
}
