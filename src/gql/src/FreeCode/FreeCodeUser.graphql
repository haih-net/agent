query freeCodeUsers($take: Int = 10, $fullInfo: Boolean = false) {
  freeCodeUsers(take: $take) {
    ...FreeCodeUser_
  }
}

query freeCodeUser($where: FreeCodeUserWhereUniqueInput!, $fullInfo: Boolean = false) {
  freeCodeUser(where: $where) {
    ...FreeCodeUser_
  }
}

query freeCodeUsersCount($where: FreeCodeUserWhereInput) {
  freeCodeUsersCount(where: $where)
}

query freeCodeMeUser($fullInfo: Boolean = true) {
  freeCodeMe {
    ...FreeCodeUser_
  }
}

mutation freeCodeSignin(
  $data: FreeCodeUserSigninDataInput!
  $where: FreeCodeUserWhereUniqueInput!
  $fullInfo: Boolean = true
) {
  freeCodeSignin(data: $data, where: $where) {
    success
    message
    token
    data {
      ...FreeCodeUser_
    }
  }
}

mutation freeCodeSignup($data: FreeCodeUserSignupDataInput!, $fullInfo: Boolean = true) {
  freeCodeSignup(data: $data) {
    success
    message
    token
  }
}

fragment FreeCodeUserNoNesting on FreeCodeUser {
  id
  username
  fullname
  createdAt
  intro @include(if: $fullInfo)
  content @include(if: $fullInfo)
}

fragment FreeCodeUser_ on FreeCodeUser {
  ...FreeCodeUserNoNesting
}
